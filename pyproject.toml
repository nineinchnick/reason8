[project]
name = "reason8"
version = "0.1.0"
description = "An AI for Beyond All Reason that learns to play from human replays"
license = "GPL-2.0-or-later"
requires-python = ">=3.15"
dependencies = [
    "boto3[crt]>=1.44.9",
    "duckdb>=2.0.1",
    "httpx>=0.28.1",
    "numpy>=2.5.5",
    "polars>=2.1.0",
    "pyyaml>=6.0.4",
    "scikit-learn>=1.9.1",
    "tqdm>=4.70.1",
    "xgboost>=3.4.1",
]

[project.scripts]
reason8 = "reason8.cli:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "mdformat>=1.0.0",
    "mdformat-deflist>=0.1.4",
    "mdformat-gfm>=1.0.0",
    "moto[s3]>=5.2.5",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
